name: Release

# One release train for both artifacts, versioned from the root package.json
# (scripts/sync-version.mjs copies it into the extension manifest):
#   1. release-cli — npm publish (trusted publishing / OIDC), git tag, GitHub
#      Release with install archives.
#   2. publish-extension — VS Code Marketplace publish without a PAT: GitHub's
#      OIDC token federates to a Microsoft Entra app registration and vsce
#      authenticates with the resulting Azure credential.
#
# Entra one-time setup (already done):
#   - App registration with a federated credential for this repo, subject
#     repo:Shailesh-714/git-bot:ref:refs/heads/main
#   - Its service principal added to the Marketplace publisher as Contributor
#   - Repo variables AZURE_CLIENT_ID and AZURE_TENANT_ID

on:
  workflow_dispatch:

jobs:
  release-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test

      - name: Read version from package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}" || true
          git push origin "v${{ steps.version.outputs.version }}" || true

      - name: Build release archives
        run: |
          sudo apt-get update && sudo apt-get install -y zip

          mkdir -p release/git-bot/dist release/git-bot/bin
          cp bundle/git-bot.cjs release/git-bot/dist/
          cp package.json release/git-bot/

          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            cp scripts/git-bot release/git-bot/bin/git-bot
            chmod +x release/git-bot/bin/git-bot
            tar -czf "git-bot-${platform}.tar.gz" -C release git-bot
          done

          cp scripts/git-bot.cmd release/git-bot/bin/git-bot.cmd
          (cd release && zip -rq ../git-bot-windows-x64.zip git-bot)

      - name: Publish to npm (trusted publishing via OIDC)
        run: npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            scripts/install.sh
            git-bot-linux-x64.tar.gz
            git-bot-linux-arm64.tar.gz
            git-bot-darwin-x64.tar.gz
            git-bot-darwin-arm64.tar.gz
            git-bot-windows-x64.zip

  publish-extension:
    needs: release-cli
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for azure/login
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Sync extension version from root package.json
        run: node scripts/sync-version.mjs

      - name: Typecheck extension
        working-directory: extension
        run: npm run typecheck

      - name: Azure login via OIDC (no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Visual Studio Marketplace
        working-directory: extension
        run: npx vsce publish --azure-credential
