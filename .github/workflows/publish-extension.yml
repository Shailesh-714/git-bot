name: Publish VS Code Extension

# Publishes extension/ to the Visual Studio Marketplace without a PAT:
# GitHub's OIDC token federates to a Microsoft Entra app registration
# (workload identity federation), and vsce authenticates with the resulting
# Azure credential.
#
# One-time setup:
#   1. Entra app registration (portal.azure.com → Microsoft Entra ID →
#      App registrations → New registration). No Azure subscription needed.
#   2. In the app: Certificates & secrets → Federated credentials → Add →
#      "GitHub Actions deploying Azure resources" → org Shailesh-714,
#      repo git-bot, entity type Branch, branch main.
#   3. marketplace.visualstudio.com/manage → publisher → Members → add the
#      app's service principal with the Contributor role.
#   4. Repo variables (Settings → Secrets and variables → Actions → Variables):
#      AZURE_CLIENT_ID and AZURE_TENANT_ID from step 1.

on:
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token for azure/login
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Lint and test core
        run: |
          npm run lint
          npm test

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Typecheck extension
        working-directory: extension
        run: npm run typecheck

      - name: Azure login via OIDC (no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Visual Studio Marketplace
        working-directory: extension
        run: npx vsce publish --azure-credential
