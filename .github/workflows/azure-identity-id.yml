name: Azure Identity ID

# One-off helper for marketplace publisher setup. Logs in as the federated
# service principal (materializing it in the Visual Studio services identity
# system) and prints its profile ID — the value to add as a Member with the
# Contributor role on marketplace.visualstudio.com/manage. Without this first
# sign-in, the Members page fails with "TF14045: identity could not be found".

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  show-identity-id:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Fetch Visual Studio services profile
        run: |
          # 499b84ac-... is the well-known resource ID of Azure DevOps / VS services
          TOKEN=$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)
          echo "Profile response (use the 'id' field as the Members entry):"
          curl -sf -H "Authorization: Bearer $TOKEN" \
            "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1" \
            | python3 -m json.tool
